name: CI/CD Blue-Green

# Controla cuándo se ejecutará el flujo de trabajo
on:
  push:
    branches:
      - main

jobs:
  ci:
    name: Integración Continua
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validar sintaxis de Python
        run: python -m py_compile app.py

      - name: Ejecutar prueba basica
        run: |
          python -c "from app import crear_servidor; print('Codigo valido')"

  cd:
    name: Despliegue Blue-Green
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Iniciar version Blue
        run: |
          python app.py --version blue --puerto 8000 > blue.log 2>&1 &
          echo $! > blue.pid
          sleep 2

      - name: Iniciar version Green
        run: |
          python app.py --version green --puerto 8001 > green.log 2>&1 &
          echo $! > green.pid
          sleep 2